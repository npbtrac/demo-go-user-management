root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/usermgmt ./cmd/usermgmt"
  bin = "./tmp/usermgmt"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "vendor", "dev-docker", ".omc", "scripts"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"
  poll = true
  poll_interval = 500

[log]
  time = true
