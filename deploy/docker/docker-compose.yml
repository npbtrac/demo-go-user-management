name: usermgmt

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: usermgmt
      POSTGRES_PASSWORD: usermgmt
      POSTGRES_DB: usermgmt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usermgmt -d usermgmt"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - usermgmt-pg:/var/lib/postgresql/data

  usermgmt:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://usermgmt:usermgmt@postgres:5432/usermgmt?sslmode=disable
      PUBLIC_HTTP_ADDR: :8080
      INTERNAL_HTTP_ADDR: :8081
      GRPC_ADDR: :9090
    ports:
      - "8080:8080"
      - "8081:8081"
      - "9090:9090"

volumes:
  usermgmt-pg:
